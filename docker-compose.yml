services:
  nominatim:
    image: mediagis/nominatim:4.4
    environment:
      PBF_URL: https://download.geofabrik.de/asia/japan-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/japan-updates/
      NOMINATIM_PASSWORD: weayther
    volumes:
      - nominatim-data:/var/lib/postgresql/14/main
    ports:
      - "8080:8080"
    shm_size: 1g

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - nominatim

  frontend:
    build: ./frontend
    ports:
      - "3050:80"
    depends_on:
      - backend

volumes:
  nominatim-data:
